<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Newspaper background -->
  <rect width="128" height="128" rx="14" fill="#f5f0e8"/>
  <!-- Masthead rules -->
  <rect x="14" y="11" width="100" height="2" fill="#111"/>
  <rect x="14" y="15" width="100" height="0.7" fill="#111"/>

  <!-- Line 1: "blackout" → fully redacted -->
  <rect x="14" y="23" width="78" height="9" rx="2" fill="#111"/>

  <!-- Line 2: "news paper" → "news" visible, "paper" redacted -->
  <text x="14" y="46" font-size="10" font-weight="700"
        font-family="Georgia, 'Times New Roman', serif" fill="#111">news</text>
  <rect x="14" y="47.5" width="22" height="1.2" rx="0.5" fill="#111"/>
  <rect x="42" y="37" width="58" height="9" rx="2" fill="#111"/>

  <!-- Line 3: "poem" visible, then redacted tail -->
  <text x="14" y="61" font-size="10" font-weight="700"
        font-family="Georgia, 'Times New Roman', serif" fill="#111">poem</text>
  <rect x="14" y="62.5" width="24" height="1.2" rx="0.5" fill="#111"/>
  <rect x="44" y="52" width="46" height="9" rx="2" fill="#111"/>

  <!-- Line 4: fully redacted -->
  <rect x="14" y="67" width="90" height="9" rx="2" fill="#111"/>

  <!-- Line 5: fully redacted -->
  <rect x="14" y="82" width="64" height="9" rx="2" fill="#111"/>

  <!-- Line 6: fully redacted -->
  <rect x="14" y="97" width="80" height="9" rx="2" fill="#111"/>

  <!-- Filler column bars -->
  <rect x="14" y="112" width="42" height="5" rx="1" fill="#111" opacity="0.3"/>
  <rect x="62" y="112" width="42" height="5" rx="1" fill="#111" opacity="0.3"/>
</svg>
